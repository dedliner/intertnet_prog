{% extends "app/layout.html" %}
{% load static %}

{% block title %}Добавить статью{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="panel panel-primary">
            <div class="panel-heading">
                <h3 class="panel-title">Добавление новой статьи</h3>
            </div>
            <div class="panel-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Заголовок</label>
                        {{ form.title }}
                    </div>

                    <div class="form-group">
                        <label>Краткое содержание</label>
                        {{ form.short_content }}
                    </div>

                    <div class="form-group">
                        <label>Полное содержание</label>
                        {{ form.full_content }}
                    </div>

                    <div class="form-group">
                        <label>Изображение статьи</label>
                        {{ form.image }}
                    </div>

                    <div class="form-group">
                        <label>Дата публикации</label>
                        {{ form.published_date }}
                    </div>

                    <button type="submit" class="btn btn-success">Добавить статью</button>
                    <a href="{% url 'blog' %}" class="btn btn-default">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
